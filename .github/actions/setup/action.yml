name: 'Setup Environment'
description: 'Install system dependencies, set up uv, Python 3.13, and sync project dependencies'

runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        if [ -f /etc/debian_version ]; then
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl git libvips python3 python3-tk python3-venv xvfb unar libatomic1 gnupg
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unar
        fi

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python 3.13 and create venv
      shell: bash
      run: |
        uv python install 3.13
        # Only create venv if it doesn't exist (may be cached)
        if [ ! -d .venv ]; then
          uv venv
        fi

    - name: Sync dependencies
      shell: bash
      env:
        PILLOW_NO_SIMD: 1
      run: |
        # Only install build deps if using container
        if [ -f /etc/debian_version ]; then
          apt-get install -y -qq libglib2.0-0 libglib2.0-dev libexpat1-dev
        fi
        # Sync all dependencies
        uv sync --locked
        # Build pyvips from source only on debian container (SIMD issues)
        if [ -f /etc/debian_version ]; then
          uv pip uninstall -y pyvips-binary || true
          uv pip install pyvips --no-binary pyvips --no-build-isolation --cache-dir /tmp/pip-cache
        fi
