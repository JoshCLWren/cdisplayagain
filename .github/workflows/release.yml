name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev python3-tk xvfb unar

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Run lint
        run: bash scripts/lint.sh

      - name: Run complete test suite
        env:
          PILLOW_NO_SIMD: 1
          VIPS_NO_DEPRECATED: 1
          ORC_CODE: backup
        run: xvfb-run -a uv run pytest

      - name: Run established performance tests
        env:
          PILLOW_NO_SIMD: 1
          VIPS_NO_DEPRECATED: 1
          ORC_CODE: backup
        run: >-
          xvfb-run -a uv run pytest -p no:cov -o addopts=""
          tests/test_performance.py tests/test_benchmark_parallel.py
          tests/test_photoimage_optimization.py tests/test_first_render.py

      - name: Build onedir bundle once
        run: uv run --active python scripts/generate_build_info.py && uv run --active pyinstaller --clean --noconfirm cdisplayagain.spec

      - name: Smoke test bundle and installer
        run: bash scripts/ci-package-check.sh

      - name: Package tested bundle and checksum
        id: package
        shell: bash
        run: |
          asset_path=$(bash scripts/package-linux.sh)
          sha256sum "$asset_path" > SHA256SUMS
          bash scripts/ci-archive-check.sh "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.asset_path }}

      - name: Upload workflow artifact for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cdisplayagain-linux-x86_64-release-validation
          path: |
            ${{ steps.package.outputs.asset_path }}
            SHA256SUMS
          retention-days: 7

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.asset_path }}" SHA256SUMS --generate-notes
