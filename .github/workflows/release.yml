name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version=$(awk -F '"' '$1 ~ /^version[[:space:]]*=/ {print $2; exit}' pyproject.toml)
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev python3-tk xvfb unar

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Run lint
        run: bash scripts/lint.sh

      - name: Run complete test suite
        env:
          PILLOW_NO_SIMD: 1
          VIPS_NO_DEPRECATED: 1
          ORC_CODE: backup
        run: xvfb-run -a uv run pytest

      - name: Run established performance tests
        env:
          PILLOW_NO_SIMD: 1
          VIPS_NO_DEPRECATED: 1
          ORC_CODE: backup
        run: >-
          xvfb-run -a uv run pytest -p no:cov -o addopts=""
          tests/test_performance.py tests/test_benchmark_parallel.py
          tests/test_photoimage_optimization.py tests/test_first_render.py

      - name: Build onedir bundle once
        run: bash scripts/docker-build-linux.sh

      - name: Smoke test bundle and installer
        run: bash scripts/ci-package-check.sh

      - name: Package tested bundle and checksum
        id: package
        shell: bash
        run: |
          asset_path=$(bash scripts/package-linux.sh)
          printf '%s  %s\n' "$(sha256sum "$asset_path" | cut -d' ' -f1)" "$(basename "$asset_path")" > SHA256SUMS
          bash scripts/ci-archive-check.sh "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdisplayagain-linux-x86_64-release
          path: |
            ${{ steps.package.outputs.asset_path }}
            SHA256SUMS
          retention-days: 7

  build-macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel is intentionally absent: Apple silicon covers every Mac sold
          # since 2020, and Intel users can build from source. Re-add with
          # "- arch: x86_64 / runner: macos-15-intel" if that changes.
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version=$(awk -F '"' '$1 ~ /^version[[:space:]]*=/ {print $2; exit}' pyproject.toml)
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The shared setup action is Linux-only: it apt-gets and rebuilds pyvips
      # from source, while macOS needs the pyvips-binary wheel that carries
      # libvips inside the bundle.
      - name: Install Python 3.13 and sync dependencies
        shell: bash
        run: |
          uv python install 3.13
          uv venv
          uv sync --locked

      - name: Build app bundle
        shell: bash
        run: |
          source .venv/bin/activate
          make build

      - name: Smoke test the bundle from a read-only working directory
        shell: bash
        run: |
          cd /
          "$GITHUB_WORKSPACE/dist/cdisplayagain.app/Contents/MacOS/cdisplayagain" --version

      - name: Verify the bundle declares its file associations
        shell: bash
        run: |
          plist=dist/cdisplayagain.app/Contents/Info.plist
          for extension in cbz cbr; do
            plutil -p "$plist" | grep -q "\"$extension\"" || {
              echo "Info.plist does not declare .$extension" >&2
              exit 1
            }
          done

      - name: Package app bundle
        id: package
        shell: bash
        run: |
          source .venv/bin/activate
          asset_path=$(bash scripts/package-macos.sh)
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload tested macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdisplayagain-macos-${{ matrix.arch }}-release
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 7

  compatibility:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            family: apt
          - name: ubuntu-24.04
            image: ubuntu:24.04
            family: apt
          - name: debian-13
            image: debian:13-slim
            family: apt
          - name: fedora-42
            image: fedora:42
            family: dnf
          - name: opensuse-leap-15.6
            image: opensuse/leap:15.6
            family: zypper
    steps:
      - name: Check out test harness and fixtures
        uses: actions/checkout@v4
      - name: Download tested release artifact
        uses: actions/download-artifact@v4
        with:
          name: cdisplayagain-linux-x86_64-release
          path: artifact
      - name: Run container compatibility checks
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e "BUILD_SHA=${BUILD_SHA}" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "${{ matrix.image }}" bash /workspace/scripts/compatibility-test.sh \
            "${{ matrix.family }}" 2>&1 | tee "compatibility-${{ matrix.name }}.log"
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Upload compatibility logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-log-${{ matrix.name }}
          path: "compatibility-${{ matrix.name }}.log"

  attest:
    permissions:
      contents: read
      id-token: write
    needs: [build-release, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download every tested release artifact
        uses: actions/download-artifact@v4
        with:
          pattern: cdisplayagain-*-release
          path: artifact
          merge-multiple: true
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            artifact/*.tar.gz
            artifact/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compatibility, attest, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Download every tested release artifact
        uses: actions/download-artifact@v4
        with:
          pattern: cdisplayagain-*-release
          path: artifact
          merge-multiple: true
      - name: Checksum the published set
        shell: bash
        run: |
          cd artifact
          rm -f SHA256SUMS
          sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          artifact/*.tar.gz artifact/*.zip artifact/SHA256SUMS --generate-notes
