name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/lockfiles') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache pip builds
        uses: actions/cache@v4
        with:
          path: /tmp/pip-cache
          key: ${{ runner.os }}-pip-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run linting
        shell: bash
        run: bash scripts/lint.sh

  tests:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/lockfiles') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache pip builds
        uses: actions/cache@v4
        with:
          path: /tmp/pip-cache
          key: ${{ runner.os }}-pip-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Create test fixtures
        shell: bash
        run: uv run python tests/create_test_comics.py

      - name: Run pytest
        shell: bash
        env:
          PILLOW_NO_SIMD: 1
          VIPS_NO_DEPRECATED: 1
        run: xvfb-run -a uv run pytest -p no:cov -o addopts=""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
